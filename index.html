<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="mainCard">
            <form class="ageForm" id="ageForm">

                <div class="inputsRow">
                    <div class="inputGroup">
                        <label for="day" class="labelText">DAY</label>
                        <input type="number" name="day" id="day" placeholder="DD">
                        <span class="errorText" id="errorTextDay1">This field is required</span>
                        <span class="errorText" id="errorTextDay2">Must be a valid date</span>
                        <span class="errorText" id="errorTextDay3">Must be a valid day</span>
                    </div>

                    <div class="inputGroup">
                        <label for="month" class="labelText">MONTH</label>
                        <input type="number" name="month" id="month" placeholder="MM">
                        <span class="errorText" id="errorTextMonth1">This field is required</span>
                        <span class="errorText" id="errorTextMonth2">Must be a valid month</span>
                    </div>

                    <div class="inputGroup">
                        <label for="year" class="labelText">YEAR</label>
                        <input type="number" name="year" id="year" placeholder="YYYY">
                        <span class="errorText" id="errorTextYear1">This field is required</span>
                        <span class="errorText" id="errorTextYear2">Must be in the past</span>
                    </div>
                </div>

                <div class="submitButton">
                    <hr class="submitLine">
                    <button id="submitBtn" class="submitBtn" type="submit">
                        <img src="./images/icon-arrow.svg" alt="SubmitButtonImage">
                    </button>
                </div>

            </form>

            <div class="resultContainer">
                <h1 class="h1NumberText" id="yearsResult">-- <span class="h1DateText">years</span>
                </h1>
                <h1 class="h1NumberText" id="monthsResult">-- <span class="h1DateText">months</span></h1>
                <h1 class="h1NumberText" id="daysResult">-- <span class="h1DateText">days</span></h1>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
